name: Windows hardware diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hardware-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Check installed inventory fixtures through managed runner
        shell: bash
        run: make python-check OBJ_DIR=_build/record-fixture PYTHON_TEST_START_DIRECTORY=tests/critical PYTHON_TEST_PATTERN=test_standard_lifecycle_binding_adapter.py PYTHON_TEST_WORKERS=1
      - name: Observe actual receiver operations with existing bounds
        run: python scripts/diagnose_windows_hardware.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hardware-stage-trace
          path: |
            logs/hardware-diagnostic/
            _build/record-fixture/python-test-report.json
